# deep_bridge_node 参数配置
# 通过 launch/deep_bridge.launch 以 private (~) 命名空间加载
#
# 协议来源：《山猫 M20 系列软件接口手册(beta) V0.1.0》第 1 章"本体监控协议"。
# 机器人本体是 UDP 服务端，这个节点是客户端；请求/响应都是 16 字节协议头 + JSON ASDU
# （{"PatrolDevice":{"Type":..,"Command":..,"Time":..,"Items":{...}}}）。

server_ip: 10.21.31.103   # 机器人 UDP 服务端地址，手册 1.1.2
server_port: 30000        # 机器人 UDP 服务端端口，手册 1.1.2

cmd_vel_topic: cmd_vel

control_rate_hz: 20.0     # 轴指令(2/21)发送频率，手册 1.2.5 建议不小于 20Hz
cmd_timeout_sec: 0.5      # 超过这么久没收到新 cmd_vel，就发全零轴指令（安全看门狗）

heartbeat_rate_hz: 2.0    # 心跳(100/100)发送频率，手册要求不小于 1Hz；
  # 机器人只向持续发心跳的 IP:端口上报状态（1.3 节），这个节点的状态回读和控制安全闸门
  # 全都依赖这份持续上报，所以心跳定时器必须先于其它一切启动步骤跑起来

max_vx: 0.6   # 轴指令 X 归一化用的前后速度上限 [m/s]，cmd_vel 的 linear.x 会被除以这个值再夹到 [-1,1]
max_vy: 0.4   # Y（左右）方向 [m/s]
max_vyaw: 0.6 # 偏航角速度 [rad/s]

auto_stand_on_start: true  # 节点启动时是否自动请求站起来
motion_state_on_start: 6   # 请求的目标运动状态(2/22 MotionParam)：6=标准运动模式。
  # 手册 1.2.3 的状态机图显示，从开机阻尼/空闲/趴下等任意状态直接请求"标准运动模式"，
  # 机器人会自己走完中间的"正在起立状态"，不需要分两步先请求"站立"(1)再单独切运动模式
  # （跟 unitree_bridge 里 RecoveryStand() 对起始姿态没有要求是同样的思路）。
stand_settle_sec: 5.0       # 请求完站立/运动模式切换后阻塞等待这么久，给起立动作留物理执行时间

gait_on_start: -1  # 开机是否额外切步态(2/23 GaitParam)：-1 表示不切，用运动模式自带的默认步态
  # （手册 1.2.4 注：运动模式切换时会自动切换到对应的默认步态）。
  # 可选步态值：1=基础(标准模式) 12=平地(敏捷模式) 13=楼梯(敏捷模式) 14=楼梯(标准模式)。
  # 手册原文：敏捷运动模式下步态速度响应性能较好，适用于导航等自主算法开发；
  # 如果这个桥接节点要跑得更跟手，可以设成 12（会自动带着切换到敏捷运动模式）。
mode_settle_sec: 1.0  # 切换运动状态/步态后阻塞等待这么久，给切换动作留出执行时间

set_usage_mode_on_start: true  # 开机是否确保处于常规模式(1101/5 Mode=0)：
  # 轴指令(手册 1.2.5)仅在常规模式下生效，导航模式下机器人不响应轴指令
status_wait_timeout_sec: 3.0   # 等待一次状态上报回读的超时（用于确认切换是否成功）
