# deep_bridge_node 参数配置
# 通过 launch/deep_bridge.launch 以 private (~) 命名空间加载
#
# 协议来源：《山猫M20S 开发资料》-「软件开发指南」V1.0.0 (2026-06-15)。
# 机器人本体是 UDP 服务端，这个节点是客户端；请求/响应都是 16 字节协议头 + JSON ASDU
# （{"PatrolDevice":{"Type":..,"Command":..,"Time":..,"Items":{...}}}）。
# 本配置对应常规使用：使用模式=常规(1.2.2 Mode=0)、运动状态=RL控制(17)、
# 步态=标准运动模式(0x100x)、运动控制=归一化轴指令(1.2.5)。
# 注意轴指令传的是"占最大速度的比例"[-1,1]，不是实际速度，换算见下面 full_scale_v*。

# 指南 1.1.2 说本体默认启用加密、DTLS 服务端为 10.21.33.103:30004。
# 但实测（lubancat 对真机）这台本体的加密是关掉的：同一个地址端口直接走明文 UDP 即可，
# use_dtls=true 反而握不上手。要改回加密就把 use_dtls 设为 true。
server_ip: 10.21.33.103
server_port: 30004
use_dtls: false

# 服务端证书校验用的 CA 文件（PEM）。指南全文没有给出证书/CA/PSK 的任何说明，
# 机器人多半是自签证书，所以默认留空 = 只加密、不校验对端身份（能防窃听，防不住
# 中间人），启动时会打一条警告。拿到厂商 CA 之后填在这里即可开启严格校验。
ca_file: ""
dtls_handshake_timeout_sec: 5.0

cmd_vel_topic: cmd_vel

control_rate_hz: 20.0     # 归一化轴指令(1.2.5)的发送频率
cmd_timeout_sec: 0.5      # 超过这么久没收到新 cmd_vel，就发全零速度指令（安全看门狗）

heartbeat_rate_hz: 2.0    # 心跳(1.2.1)发送频率，指南要求不小于 1Hz
  # 机器人只向持续发心跳的 IP:端口上报状态（1.3），这个节点的状态回读和控制安全闸门
  # 全都依赖这份持续上报，所以心跳线程必须先于其它一切启动步骤跑起来

# 安全限速：cmd_vel 先按 m/s、rad/s 夹到这里的范围，再换算成归一化比例下发。
max_vx: 0.75   # 前后 [m/s]
max_vy: 0.6    # 左右 [m/s]
max_vyaw: 1.0  # 偏航角速度 [rad/s]

# 归一化轴指令(1.2.5)的满量程：轴指令里的 ±1.0 对应多大的实际速度。
# 换算 ratio = clamp(cmd_vel, ±max_v) / full_scale_v，再夹到 ±1。
#
# ★ 这三个值指南里没有给，默认值抄的是旧版《山猫M20 开发指南》basic_server 协议 4.5
#   里 0x3002 平地步态的范围（X ±2.0 / Y ±1.0 / Yaw ±1.5）。那是导航运动模式的步态，
#   常规模式用的标准运动模式步态未必一样，**上机前需要实测校准**：
#   下发一个已知比例（比如 X=0.2）走一段，用 /LIO/odom_vehicle 读实际速度，
#   full_scale_vx = 实测速度 / 0.2。
#   校准前宁可设大不设小——设大了机器人走得比指令慢，设小了会比指令快。
full_scale_vx: 2.0    # 前后 [m/s]
full_scale_vy: 1.0    # 左右 [m/s]
full_scale_vyaw: 1.5  # 偏航角速度 [rad/s]

auto_stand_on_start: true  # 节点启动时是否自动下发起立指令(1.2.3 MotionParam=1)
  # 站立(1)是临时过渡状态，机器人会自动进入 RL 控制（MotionState=17）——只有 RL
  # 控制态才能执行移动控制和步态切换；启动流程会回读 BasicStatus 确认进入 17 后再继续。
stand_settle_sec: 5.0       # 下发起立指令后阻塞等待这么久，给起立动作留物理执行时间

gait_on_start: 4097  # 开机额外切换步态(1.2.4 GaitParam)目标值：0x1001=4097 基础(标准运动模式)
  # 步态表：0x1001=4097 基础(标准) / 0x1002=4098 高台(标准) / 0x1003=4099 楼梯(标准)
  #        0x3002=12290 平地(导航) / 0x3003=12291 楼梯(导航)。
  # （0x1002/0x1003 两处对不上：指南 1.2.4 写 0x1003=楼梯(标准)，1.3.1.1 写 0x1002=高台(标准)。）
  # 常规模式只能用标准运动模式的步态(0x100x)：指南 1.2.4 说切步态会自动切到该步态
  # 对应的运动模式，所以这里填 0x3002/0x3003 会把机器人带回导航运动模式。
  # 每次起立后或切换使用模式时步态会重置，所以这里在起立完成、进入 RL 控制态之后再切。
mode_settle_sec: 1.0  # 切换运动状态/步态后阻塞等待这么久，给切换动作留出执行时间

set_usage_mode_on_start: true  # 开机是否确保处于常规模式(1.2.2 Mode=0)：
  # 归一化轴指令(1.2.5)仅在常规/辅助模式下生效；导航模式下要用真实轴指令(1.2.6)。
  # 安全闸门也只认常规模式(0)，使用模式不对时一律下发全零速度。
status_wait_timeout_sec: 3.0   # 等待一次状态上报回读的超时（用于确认切换是否成功）
