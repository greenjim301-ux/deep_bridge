# deep_bridge_node 参数配置
# 通过 launch/deep_bridge.launch 以 private (~) 命名空间加载
#
# 协议来源：《山猫M20 开发指南》-「软件开发指南」「运动控制（basic_server 协议）」。
# 机器人本体是 UDP 服务端，这个节点是客户端；请求/响应都是 16 字节协议头 + JSON ASDU
# （{"PatrolDevice":{"Type":..,"Command":..,"Time":..,"Items":{...}}}）。
# 本配置对应导航使用：使用模式=导航(1)、运动状态=RL控制(17)、步态=平地/敏捷(0x3002)、
# 运动控制=速度指令(2/25)。

server_ip: 10.21.31.103   # 机器人 UDP 服务端地址，手册 1.1.2
server_port: 30000        # 机器人 UDP 服务端端口，手册 1.1.2

cmd_vel_topic: cmd_vel

control_rate_hz: 20.0     # 速度指令(2/25)发送频率，basic_server 协议 4.5 建议不低于 20Hz
cmd_timeout_sec: 0.5      # 超过这么久没收到新 cmd_vel，就发全零速度指令（安全看门狗）；
  # 协议 4.5 机器人侧也有 500ms 超时保护：超时未收到速度指令会自动减速进入安全状态

heartbeat_rate_hz: 2.0    # 心跳(100/100)发送频率；协议 5.1：需先发送心跳指令后才收到状态上报
  # 机器人只向持续发心跳的 IP:端口上报状态，这个节点的状态回读和控制安全闸门
  # 全都依赖这份持续上报，所以心跳定时器必须先于其它一切启动步骤跑起来

max_vx: 0.75   # 速度指令(2/25) X 的钳位上限 [m/s]：cmd_vel 的 linear.x 按 m/s 直接下发并夹到 ±max_vx
  # （不再做归一化；协议 4.5 中 0x3002 平地/敏捷的有效范围 X ∈ [-2.0, -0.15] ∪ [0.15, 2.0]）
max_vy: 0.6   # Y（左右）方向 [m/s]（0x3002 有效范围 Y ∈ [-1.0, -0.25] ∪ [0.25, 1.0]）
max_vyaw: 1.0 # 偏航角速度 [rad/s]（0x3002 有效范围 Yaw ∈ [-1.5, -0.35] ∪ [0.35, 1.5]）

auto_stand_on_start: true  # 节点启动时是否自动下发起立指令(2/22 MotionParam=1)
  # basic_server 协议 4.2/6：站立(1)是临时过渡状态，机器人会自动进入 RL 控制
  # （MotionState=17）——只有 RL 控制态才能执行移动控制和步态切换；启动流程会
  # 回读 BasicStatus 确认已经进入 17 后再继续。
stand_settle_sec: 5.0       # 下发起立指令后阻塞等待这么久，给起立动作留物理执行时间

gait_on_start: 12290  # 开机额外切换步态(2/23 GaitParam)目标值：0x3002=12290 平地(敏捷运动模式)
  # 协议 2 节步态表：0x1001=4097 基础(标准) / 0x1003=4099 楼梯(标准)
  # 0x3002=12290 平地(敏捷) / 0x3003=12291 楼梯(敏捷)。
  # 每次起立后或切换使用模式时，步态会自动重置为基础步态(0x1001)，所以这里在起立
  # 完成、进入 RL 控制态之后再切到目标步态；敏捷步态速度响应好，适合导航等自主算法。
mode_settle_sec: 1.0  # 切换运动状态/步态后阻塞等待这么久，给切换动作留出执行时间

set_usage_mode_on_start: true  # 开机是否确保处于导航模式(1101/5 Mode=1)：
  # 速度指令(2/25)仅在导航模式下生效，常规/辅助模式下请使用轴指令(2/21)
status_wait_timeout_sec: 3.0   # 等待一次状态上报回读的超时（用于确认切换是否成功）
