# deep_bridge_node 参数配置
# 通过 launch/deep_bridge.launch 以 private (~) 命名空间加载
#
# 协议来源：《山猫M20S 开发资料》-「软件开发指南」V1.0.0 (2026-06-15)。
# 机器人本体是 UDP 服务端，这个节点是客户端；请求/响应都是 16 字节协议头 + JSON ASDU
# （{"PatrolDevice":{"Type":..,"Command":..,"Time":..,"Items":{...}}}）。
# 运动控制走轴指令，种类由 usage_mode 决定（见下）；运动状态统一要求 RL控制(17)。

# 指南 1.1.2 说本体默认启用加密、DTLS 服务端为 10.21.33.103:30004。
# 但实测（lubancat 对真机）这台本体的加密是关掉的：同一个地址端口直接走明文 UDP 即可，
# use_dtls=true 反而握不上手。要改回加密就把 use_dtls 设为 true。
server_ip: 10.21.33.103
server_port: 30004
use_dtls: false

# 服务端证书校验用的 CA 文件（PEM）。指南全文没有给出证书/CA/PSK 的任何说明，
# 机器人多半是自签证书，所以默认留空 = 只加密、不校验对端身份（能防窃听，防不住
# 中间人），启动时会打一条警告。拿到厂商 CA 之后填在这里即可开启严格校验。
ca_file: ""
dtls_handshake_timeout_sec: 5.0

cmd_vel_topic: cmd_vel

control_rate_hz: 20.0     # 轴指令的发送频率
cmd_timeout_sec: 0.5      # 超过这么久没收到新 cmd_vel，就发全零速度指令（安全看门狗）

heartbeat_rate_hz: 2.0    # 心跳(1.2.1)发送频率，指南要求不小于 1Hz
  # 机器人只向持续发心跳的 IP:端口上报状态（1.3），这个节点的状态回读和控制安全闸门
  # 全都依赖这份持续上报，所以心跳线程必须先于其它一切启动步骤跑起来

# 使用模式。轴指令的种类必须和它配对，所以只有这一个开关，不会配出无效组合：
#   0 = 常规模式 -> 归一化轴指令(指南 1.2.5)，下发 [-1,1] 的"占最大速度的比例"，
#                   需要下面的 full_scale_v* 把 cmd_vel 的 m/s 换算过去
#   1 = 导航模式 -> 真实轴指令(指南 1.2.6)，直接下发 m/s 与 rad/s，不需要换算
# 指南 1.2.2 还有 2=辅助模式（1.2.5 说它也能执行归一化轴指令），本节点不支持。
# 安全闸门会要求本体回报的使用模式严格等于这个值，不一致就一律下发全零速度。
usage_mode: 0

# 安全限速，两种模式都生效：cmd_vel 先按 m/s、rad/s 夹到这里的范围。
# 常规模式下再除以 full_scale_v* 换算成比例；导航模式下这就是最终下发值
#（指南 1.2.6 明确本体不会再额外限速，所以这三个值是唯一的限速）。
max_vx: 0.75   # 前后 [m/s]
max_vy: 0.6    # 左右 [m/s]
max_vyaw: 1.0  # 偏航角速度 [rad/s]

# ===== 厂商《各个步态的有效速度范围》表（适用软件包版本 ≥V1.1.7）=====
#
#  步态名称    十六进制码   X 轴线速度 (m/s)            Y 轴线速度 (m/s)            Yaw 角速度 (rad/s)
#  标准-基础   0x1001      [-2.0,-0.2] ∪[0.2, 2.0]    [-1.0,-0.35]∪[0.35,1.0]    [-2.0,-0.5] ∪[0.5, 2.0]
#  标准-楼梯   0x1003      [-2.0,-0.15]∪[0.15,2.0]    [-1.0,-0.3] ∪[0.3, 1.0]    [-2.0,-0.4] ∪[0.4, 2.0]
#  敏捷-平地   0x3002      [-2.0,-0.15]∪[0.15,2.0]    [-1.0,-0.25]∪[0.25,1.0]    [-1.5,-0.35]∪[0.35,1.5]
#  敏捷-楼梯   0x3003      [-2.0,-0.15]∪[0.15,2.0]    [-1.0,-0.3] ∪[0.3, 1.0]    [-2.0,-0.4] ∪[0.4, 2.0]
#
# 只用这张表的**区间上界**做满量程，默认对应 gait_on_start 的 0x1001 标准-基础，
# 换步态时要照表改。注意四个步态的 X/Y 上界都一样（2.0 / 1.0），只有 Yaw 上界
# 0x3002 是 1.5、其余是 2.0。
#
# 区间下界（零附近被挖掉的那段）**没有做任何处理**：小于下界的指令照常原样下发，
# 本体怎么处理未知。曾经实现过"落进死区就归零"，但下界这组数据的可靠性存疑，
# 而且按它处理会和 SCAN-Planner 闭环控制器的整定打架（controller 的 max_vy 恰好
# 等于 0x1001 的 Y 下界 0.35，侧向指令会几乎全被吃掉），所以不按它做。
#
# 这张表里没有 0x1002，且把 0x1003 列为"标准-楼梯"，跟指南 1.2.4 一致（指南 1.3.1.1
# 写的 0x1002=高台(标准) 对不上，以这张表为准）。

# 满量程：归一化轴指令(1.2.5)里的 ±1.0 对应多大的实际速度，换算 ratio = v / full_scale_v。
# 只在 usage_mode=0 时用到；usage_mode=1 直接下发实际速度，这三个值不参与。
full_scale_vx: 2.0    # 前后 [m/s]
full_scale_vy: 1.0    # 左右 [m/s]
full_scale_vyaw: 2.0  # 偏航角速度 [rad/s]

auto_stand_on_start: true  # 节点启动时是否自动下发起立指令(1.2.3 MotionParam=1)
  # 站立(1)是临时过渡状态，机器人会自动进入 RL 控制（MotionState=17）——只有 RL
  # 控制态才能执行移动控制和步态切换；启动流程会回读 BasicStatus 确认进入 17 后再继续。
stand_settle_sec: 5.0       # 下发起立指令后阻塞等待这么久，给起立动作留物理执行时间

gait_on_start: 4097  # 开机额外切换步态(1.2.4 GaitParam)目标值：0x1001=4097 基础(标准运动模式)
  # 填 -1 表示不切步态，也不把步态纳入运行期安全闸门（本体当前是什么步态就用什么）。
  # 填了具体值的话，运行期会要求本体回报的步态一直等于它——换了步态 full_scale_v*
  # 就整体错了，此时停住比按错误比例继续走安全。
  # 可选值：0x1001=4097 标准-基础 / 0x1003=4099 标准-楼梯
  #        0x3002=12290 敏捷-平地 / 0x3003=12291 敏捷-楼梯（指南里称"导航运动模式"）。
  # ★ 改这里就必须同步改上面的 full_scale_v*，它是按步态给的。
  # 步态表里的"标准/导航运动模式"是指南 1.2.3 的运动模式，跟 usage_mode 的常规/导航
  # (指南 1.2.2 使用模式)是两个维度——实测导航使用模式配基础步态(0x1001)也能跑，
  # 所以这个值不跟着 usage_mode 走，按实际需要单独配。
  # 每次起立后或切换使用模式时步态会重置，所以这里在起立完成、进入 RL 控制态之后再切。
mode_settle_sec: 1.0  # 切换运动状态/步态后阻塞等待这么久，给切换动作留出执行时间

set_usage_mode_on_start: true  # 开机是否主动把本体切到上面 usage_mode 指定的使用模式(1.2.2)。
  # 关掉的话本体当前是什么模式就用什么模式，但安全闸门仍然只认 usage_mode，
  # 两者不一致就会一直下发全零速度、机器人不动。
status_wait_timeout_sec: 3.0   # 启动时等待一次状态上报回读的超时（用于确认切换是否成功）

status_timeout_sec: 1.0  # 运行期状态上报的新鲜度上限 [s]：超过这么久没收到新的基础状态，
  # 安全闸门就关闭、一律下发全零速度。指南 1.3.1.1 是 2Hz 上报，1.0s 留了一倍余量。
  # 为什么必须有这一条：状态里的 valid 只说明"收到过"，不说明"现在还收得到"。上报一断
  # （网络抖动、robotserve 重启、DTLS 会话重置、机器人改向别的客户端上报），旧状态会一直
  # 停在 valid=true，闸门就退化成"机器人曾经说过安全"——而 HES、使用模式、运动状态在那
  # 期间都可能已经变了。cmd_vel 那个看门狗只覆盖上行断流，下行断流靠的就是这个值。
